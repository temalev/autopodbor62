name: Deploy Nuxt SSG to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate site
        env:
          NUXT_PUBLIC_BASE_URL: /${{ github.event.repository.name }}/
          NUXT_PUBLIC_FORMSPREE_ENDPOINT: https://formspree.io/f/mqenzran
        run: npm run generate

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .output/public
          cname: автоподбор62.рф

